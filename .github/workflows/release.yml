name: Release NuGet

on:
  push:
    tags:
      - "v*.*.*"

# Only 'contents: write' is required, and only because this workflow creates a
# GitHub Release and uploads assets. Publishing to nuget.org uses an API key, so
# no 'packages: write' scope is needed.
permissions:
  contents: write

concurrency:
  # Serialize per tag; never cancel an in-progress publish for the same tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Validate tag and resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is the trusted, pushed tag name (e.g. v1.2.3).
          tag="${GITHUB_REF_NAME}"
          echo "Release tag: ${tag}"
          if [ "${tag#v}" = "${tag}" ]; then
            echo "::error::Release tag must start with 'v' (got '${tag}')."
            exit 1
          fi
          version="${tag#v}"
          if [ -z "${version}" ]; then
            echo "::error::Version is empty after stripping the 'v' prefix."
            exit 1
          fi
          # SemVer 2.0 shape: MAJOR.MINOR.PATCH[-prerelease][+buildmetadata].
          # Each dot-separated identifier must be non-empty.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${version}" =~ $semver ]]; then
            echo "::error::Tag '${tag}' does not resolve to a valid SemVer 2.0 version ('${version}')."
            exit 1
          fi
          # NuGet package version drops build metadata; use it for name matching.
          pkg_version="${version%%+*}"
          # Numeric prerelease identifiers must not contain leading zeroes.
          if [ "${pkg_version#*-}" != "${pkg_version}" ]; then
            prerelease_value="${pkg_version#*-}"
            IFS='.' read -r -a prerelease_identifiers <<< "${prerelease_value}"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "${identifier}" =~ ^[0-9]+$ ]] &&
                 [ "${#identifier}" -gt 1 ] &&
                 [ "${identifier#0}" != "${identifier}" ]; then
                echo "::error::Numeric prerelease identifier '${identifier}' must not contain leading zeroes."
                exit 1
              fi
            done
          fi
          # Prerelease when a hyphen is present in the version core (before '+').
          if [ "${pkg_version#*-}" != "${pkg_version}" ]; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "version=${pkg_version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved package version: ${pkg_version} (prerelease=${prerelease})"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Full history and tags are required so MinVer computes the exact
          # version from the pushed tag.
          fetch-depth: 0

      # The same read-only guard the pull-request workflow runs, so a tag
      # release can never ship from a checkout with tracked junk or a broken
      # ignore contract. Runs before restore, build and publish.
      - name: Verify repository hygiene
        run: scripts/verify-repository-hygiene.sh

      - name: Verify tagged commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag must point to a commit reachable from origin/main."
            exit 1
          fi
          echo "Verified tagged commit is reachable from origin/main."

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      # Restores the repository-local tool manifest (.config/dotnet-tools.json),
      # which pins the 'sourcelink' tool used to validate the PDBs.
      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore SYT.RozetkaPay.sln

      # ContinuousIntegrationBuild=true normalizes embedded source paths to
      # '/_/*' so no runner filesystem root leaks into the published symbols.
      - name: Build
        run: |
          dotnet build SYT.RozetkaPay.sln -c Release --no-restore -warnaserror \
            -p:ContinuousIntegrationBuild=true

      - name: Test
        run: |
          dotnet test SYT.RozetkaPay.sln -c Release --no-build \
            --logger "trx;LogFilePrefix=test-results" \
            --results-directory ./TestResults

      # Rebuilds the tagged commit in a second, throwaway worktree under a
      # different filesystem root and requires identical DLL/PDB/XML hashes.
      - name: Verify deterministic build
        run: scripts/verify-deterministic-build.sh

      - name: Pack
        run: |
          dotnet pack src/SYT.RozetkaPay/SYT.RozetkaPay.csproj -c Release --no-build \
            -p:ContinuousIntegrationBuild=true -o ./artifacts

      # Identical to the pull-request gate: icon, nuspec, repository commit,
      # symbol package shape and remote Source Link checksums. Runs before the
      # tag/version gate and before any publish.
      - name: Verify package artifacts
        run: scripts/verify-package-artifacts.sh ./artifacts "$(git rev-parse HEAD)"

      - name: Verify package version matches tag
        id: verify
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          nupkgs=(./artifacts/*.nupkg)
          snupkgs=(./artifacts/*.snupkg)
          if [ "${#nupkgs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg, found ${#nupkgs[@]}: ${nupkgs[*]:-none}"
            exit 1
          fi
          if [ "${#snupkgs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .snupkg, found ${#snupkgs[@]}: ${snupkgs[*]:-none}"
            exit 1
          fi
          nupkg="${nupkgs[0]}"
          snupkg="${snupkgs[0]}"
          if [ ! -s "${nupkg}" ]; then
            echo "::error::Package is empty: ${nupkg}"
            exit 1
          fi
          if [ ! -s "${snupkg}" ]; then
            echo "::error::Symbol package is empty: ${snupkg}"
            exit 1
          fi
          expected_name="SYT.RozetkaPay.${EXPECTED_VERSION}.nupkg"
          expected_symbols_name="SYT.RozetkaPay.${EXPECTED_VERSION}.snupkg"
          actual_name="$(basename "${nupkg}")"
          actual_symbols_name="$(basename "${snupkg}")"
          if [ "${actual_name}" != "${expected_name}" ]; then
            echo "::error::Package '${actual_name}' does not match tag-derived '${expected_name}'. Refusing to publish."
            exit 1
          fi
          if [ "${actual_symbols_name}" != "${expected_symbols_name}" ]; then
            echo "::error::Symbol package '${actual_symbols_name}' does not match tag-derived '${expected_symbols_name}'. Refusing to publish."
            exit 1
          fi
          nuspec_version="$(
            unzip -p "${nupkg}" '*.nuspec' |
              sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p'
          )"
          if [ "${nuspec_version}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Package nuspec version '${nuspec_version:-missing}' does not match tag-derived '${EXPECTED_VERSION}'. Refusing to publish."
            exit 1
          fi
          {
            echo "nupkg=${nupkg}"
            echo "snupkg=${snupkg}"
          } >> "$GITHUB_OUTPUT"
          echo "Verified package matches tag: ${nupkg}"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd ./artifacts
          sha256sum -- *.nupkg *.snupkg > SHA256SUMS
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Publish to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUPKG_PATH: ${{ steps.verify.outputs.nupkg }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::NUGET_API_KEY secret is not configured; aborting release before publish."
            exit 1
          fi
          # Pushing the primary .nupkg also pushes the adjacent .snupkg to
          # nuget.org automatically. --skip-duplicate keeps reruns idempotent.
          dotnet nuget push "$NUPKG_PATH" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate


      - name: Verify the published package is the package that was built
        shell: bash
        env:
          PACKAGE_ID: SYT.RozetkaPay
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          NUPKG_PATH: ${{ steps.verify.outputs.nupkg }}
        run: |
          set -euo pipefail
          # The push above reports success and stops there. Two things it does not establish:
          # that the package became downloadable at all, and - when --skip-duplicate silently
          # skipped an existing version - that what is published is what was just built.
          #
          # The second one has teeth. If a previous run pushed successfully and then failed
          # before creating the GitHub release, a rerun skips the duplicate and attaches
          # freshly built bits to the release. Both channels then carry the same version
          # number with different contents, and the workflow is green.
          #
          # Downloading and comparing is the only way to know. Indexing is not instant, so
          # this polls rather than assuming the package is there the moment push returns.
          lower_id="$(echo "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')"
          url="https://api.nuget.org/v3-flatcontainer/${lower_id}/${PACKAGE_VERSION}/${lower_id}.${PACKAGE_VERSION}.nupkg"

          published=""
          for attempt in $(seq 1 30); do
            if curl --fail --silent --location --max-time 60 -o published.nupkg "$url"; then
              published="yes"
              echo "Package downloaded on attempt ${attempt}."
              break
            fi
            echo "Not indexed yet (attempt ${attempt}/30); waiting 20s."
            sleep 20
          done

          if [ -z "$published" ]; then
            echo "::error::${PACKAGE_ID} ${PACKAGE_VERSION} did not become downloadable within 10 minutes."
            exit 1
          fi

          built_hash="$(sha256sum "$NUPKG_PATH" | cut -d' ' -f1)"
          published_hash="$(sha256sum published.nupkg | cut -d' ' -f1)"

          echo "built     : ${built_hash}"
          echo "published : ${published_hash}"

          if [ "$built_hash" != "$published_hash" ]; then
            echo "::error::The package on nuget.org is not the package this run built. A previous run \
          published a different build under the same version. Do not attach these artifacts to a \
          release: publish a new version instead."
            exit 1
          fi

          echo "Published package is byte-identical to the one built here."

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Created only after a successful NuGet publish. gh release create
          # hard-fails if a release already exists for this tag, so a rerun never
          # silently overwrites an existing release.
          args=(
            "$GITHUB_REF_NAME"
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/SHA256SUMS
            --title "$GITHUB_REF_NAME"
            --verify-tag
            --generate-notes
          )
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
