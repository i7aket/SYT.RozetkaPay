name: Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so MinVer can compute the version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SYT.RozetkaPay.sln

      - name: Build
        run: dotnet build SYT.RozetkaPay.sln -c Release --no-restore -warnaserror

      - name: Test
        run: |
          dotnet test SYT.RozetkaPay.sln -c Release --no-build \
            --logger "trx;LogFilePrefix=test-results" \
            --results-directory ./TestResults

      - name: Pack
        run: dotnet pack src/SYT.RozetkaPay/SYT.RozetkaPay.csproj -c Release --no-build -o ./artifacts

      - name: Verify package artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          nupkgs=(./artifacts/*.nupkg)
          snupkgs=(./artifacts/*.snupkg)
          if [ "${#nupkgs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg, found ${#nupkgs[@]}: ${nupkgs[*]:-none}"
            exit 1
          fi
          if [ "${#snupkgs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .snupkg, found ${#snupkgs[@]}: ${snupkgs[*]:-none}"
            exit 1
          fi
          if [ ! -s "${nupkgs[0]}" ]; then
            echo "::error::Package is empty: ${nupkgs[0]}"
            exit 1
          fi
          if [ ! -s "${snupkgs[0]}" ]; then
            echo "::error::Symbol package is empty: ${snupkgs[0]}"
            exit 1
          fi
          echo "Verified package: ${nupkgs[0]}"
          echo "Verified symbols: ${snupkgs[0]}"
